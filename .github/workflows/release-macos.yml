name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check

      - name: Build app and DMG
        run: npm run tauri:dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-analytics-studio-macos-${{ runner.arch }}
          path: outputs/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" outputs/*.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" outputs/*.dmg \
              --title "IBKR Analytics Studio ${GITHUB_REF_NAME}" \
              --notes-file CHANGELOG.md
          fi
